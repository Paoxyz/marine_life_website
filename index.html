<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marine Life Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen text-gray-100 font-sans overflow-x-hidden antialiased">
    
 <div class="fixed inset-0 z-[-2] overflow-hidden bg-black pointer-events-none">
    <div class="absolute top-1/2 left-1/2 w-[100vw] h-[56.25vw] min-h-[100vh] min-w-[177.77vh] -translate-x-1/2 -translate-y-1/2 scale-[1.3] pointer-events-none">
        <div id="youtube-bg-player"></div>
    </div>
    <div class="absolute inset-0 z-10 pointer-events-auto"></div>
</div>

    <!-- Charcoal overlay to tone down bright scenes and keep text readable -->
    <div class="fixed inset-0 z-[-1] bg-[#1c1d21]/30"></div>

    <!-- Minimalist Glass Navbar -->
    <nav class="fixed w-full top-0 z-50 bg-[#1c1d21]/60 backdrop-blur-md border-b border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-light tracking-widest text-white">OCEAN<span class="font-bold text-blue-400">ARCHIVE</span></a>
            <ul class="hidden md:flex space-x-8 text-xs uppercase tracking-[0.2em] text-gray-300">
                <li><a href="#home" class="hover:text-white transition-colors">Home</a></li>
                <li><a href="#explore" class="hover:text-white transition-colors">Explore</a></li>
                <li><a href="#" class="hover:text-white transition-colors">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Full-Screen Hero Introduction -->
    <section id="home" class="min-h-screen flex flex-col justify-center items-center text-center relative z-10 px-6 pt-20">
        <h1 class="text-6xl md:text-8xl font-light tracking-tighter text-white mb-6 drop-shadow-2xl">
            Deep <span class="font-bold">Blue</span>
        </h1>
        <p class="text-lg md:text-xl text-gray-300 max-w-2xl font-light tracking-wide drop-shadow-md mb-16">
            Descend into a curated archive of the ocean's most magnificent and elusive creatures. Hover to interact.
        </p>
        
        <!-- Animated Scroll Indicator -->
        <a href="#explore" class="animate-bounce flex flex-col items-center text-gray-400 hover:text-white transition-colors mt-8">
            <span class="text-[10px] uppercase tracking-[0.3em] mb-3">Scroll to Dive</span>
            <svg class="w-6 h-6 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </a>
    </section>

    <!-- The Main Grid Section -->
    <main id="explore" class="container mx-auto px-6 py-24 min-h-screen">
        <div id="marine-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Cards injected by main.js -->
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
